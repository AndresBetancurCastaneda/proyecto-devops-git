apiVersion: apps/v1
kind: Deployment

metadata:
  name: semana8
  namespace: semana8

spec:
  replicas: 1

  selector:
    matchLabels:
      app: semana8

  template:
    metadata:
      labels:
        app: semana8

    spec:
      containers:
      - name: semana8
        image: semana8:1.0

        ports:
        - containerPort: 8080